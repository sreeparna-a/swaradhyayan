# Swaradhyayan – Raaga Knowledge Module
# Apache vhost: static frontend + reverse proxy to BaseX HTTP/RESTXQ server.
#
# Requires: a2enmod proxy proxy_http
# Install:  cp swaradhyayan.conf /etc/apache2/sites-available/
#           a2ensite swaradhyayan
#           systemctl reload apache2

<VirtualHost *:80>
    ServerName swaradhyayan.local
    # ServerAlias www.swaradhyayan.local

    DocumentRoot /var/www/swaradhyayan/frontend

    <Directory /var/www/swaradhyayan/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---- API: reverse proxy to BaseX's RESTXQ HTTP server ----
    # BaseX's own HTTP server (basexhttp) listens on 8984 by default and
    # serves the endpoints declared with %rest:path in restxq/api.xqm
    # directly at its root, e.g. http://127.0.0.1:8984/raagas
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /api/ http://127.0.0.1:8984/
    ProxyPassReverse /api/ http://127.0.0.1:8984/

    ErrorLog  ${APACHE_LOG_DIR}/swaradhyayan-error.log
    CustomLog ${APACHE_LOG_DIR}/swaradhyayan-access.log combined
</VirtualHost>
